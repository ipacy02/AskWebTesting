name: Debug Maven Build

on:
  push:
    branches:
      - master

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Show full directory tree
        run: |
          pwd
          ls -R

      - name: Show Java version
        run: java -version

      - name: Show Maven version
        run: mvn -version

      - name: Run Maven with full debug
        run: mvn -e -X -f AskWebTesting/AskTesting/pom.xml test
