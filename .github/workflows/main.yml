name: Run unit tests

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17   # change to 11 if your pom uses Java 11

      - name: Verify Java
        run: java -version

      - name: Run Maven tests
        run: mvn -f AskWebTesting/AskTesting/pom.xml test
